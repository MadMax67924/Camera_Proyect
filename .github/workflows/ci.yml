
name: CI (self-hosted, Python local, sin venv)

on:
  push:
    branches: [ "LunusushiFeatures" ]
  pull_request:
    branches: [ "LunusushiFeatures" ]
  workflow_dispatch:

jobs:
  run-local-python:
    runs-on: self-hosted
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      PYTHON_BIN: "python3"   # cambia a 'python' si tu runner usa ese binario

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias (requirements.txt) sin venv (modo usuario)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pip-cache
          if [ ! -f requirements.txt ]; then
            echo "ERROR: no se encontró requirements.txt en el repo" >&2
            exit 1
          fi
          ${PYTHON_BIN} -m pip install --upgrade --user pip wheel setuptools
          ${PYTHON_BIN} -m pip install --user --cache-dir .pip-cache -r requirements.txt
          ${PYTHON_BIN} -m pip list

      - name: Ejecutar build_embeddings con run.sh
        shell: bash
        env:
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_NAME: ${{ env.DB_NAME }}
        run: |
          set -euo pipefail
          chmod +x ./run.sh || true
          ./run.sh
