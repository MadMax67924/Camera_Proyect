
name: CI (LunusushiFeatures)

on:
  push:
    branches: [ "LunusushiFeatures" ]
  pull_request:
    branches: [ "LunusushiFeatures" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}
          # Si quisieras un usuario app, podrías añadir:
          # MYSQL_USER: appuser
          # MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=60
          --health-start-period=60s

    env:
      # ✅ Usa el hostname del servicio: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MySQL client + system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else
            pip install opencv-python numpy python-dotenv mysql-connector-python
          fi

      - name: Wait for MySQL and apply schema
        run: |
          echo "Waiting for MySQL to be healthy..."
          for i in $(seq 1 60); do
            mysqladmin ping -h "${DB_HOST}" -uroot -p"${DB_PASSWORD}" && break
            echo "mysql not ready yet; sleeping..."
            sleep 2
          done

          echo "Creating DB if needed..."
          mysql -h "${DB_HOST}" -P "${DB_PORT}" -uroot -p"${DB_PASSWORD}" \
            -e "CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\`"

          if [ -f db/schema.sql ]; then
            echo "Applying schema..."
            mysql -h "${DB_HOST}" -P "${DB_PORT}" -uroot -p"${DB_PASSWORD}" "${DB_NAME}" < db/schema.sql
          else
            echo "[WARN] db/schema.sql not found"
          fi

      - name: Run script
        run: |
          chmod +x run.sh || true
          bash run.sh
