
name: CI (LunusushiFeatures - self-hosted)

on:
  push:
    branches: [ "LunusushiFeatures" ]
  pull_request:
    branches: [ "LunusushiFeatures" ]
  workflow_dispatch:


jobs:
  build-and-run:
    runs-on: self-hosted   # o ubuntu-latest si usas runner hospedado
    steps:
      - uses: actions/checkout@v4

      # Si NO usas setup-python porque es self-hosted, asegúrate de tener python3 instalado
      - name: Crear venv
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install opencv-python numpy python-dotenv mysql-connector-python
          fi

      - name: Ejecutar script con venv
        run: |
          source .venv/bin/activate
          bash run.sh
