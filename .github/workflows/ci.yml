
name: CI (self-hosted con venv sin activar)
on:
  push:
    branches: [ "LunusushiFeatures" ]
  pull_request:
    branches: [ "LunusushiFeatures" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: self-hosted
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      VENV_DIR: .venv

    steps:
      - uses: actions/checkout@v4

      - name: Crear venv
        shell: bash
        run: |
          python3 -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/python" -m pip install --upgrade pip setuptools wheel

      - name: Instalar dependencias en la venv
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            "${VENV_DIR}/bin/pip" install -r requirements.txt
          else
            "${VENV_DIR}/bin/pip" install opencv-python numpy python-dotenv mysql-connector-python
          fi

      - name: Aplicar schema (opcional)
        shell: bash
        run: |
          if [ -f db/schema.sql ] && command -v mysql >/dev/null; then
            mysql -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USER}" -p"${DB_PASSWORD}" \
              -e "CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\`"
            mysql -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USER}" -p"${DB_PASSWORD}" "${DB_NAME}" < db/schema.sql
          else
            echo "[INFO] Saltando aplicar schema (sin mysql o sin archivo)."
          fi

      - name: Ejecutar tu script con la venv (sin activar)
        shell: bash
        run: |
          chmod +x run.sh || true
          # Ejecuta usando el intérprete de la venv
          "${VENV_DIR}/bin/python" -m src.build_embeddings --dataset "$(pwd)/dataset/raw"
          # o si run.sh invoca python internamente, haz:
          # sed -i '1s|^|#!/usr/bin/env bash\n|' run.sh
          # VENV_PY="${VENV_DIR}/bin/python" bash run.sh
