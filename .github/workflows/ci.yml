
name: CI (LunusushiFeatures)

on:
  push:
    branches: [ "LunusushiFeatures" ]
  pull_request:
    branches: [ "LunusushiFeatures" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    # Servicio MariaDB
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MARIADB_DATABASE: ${{ secrets.DB_NAME }}
          # Si quieres usuario/app aparte:
          # MARIADB_USER: appuser
          # MARIADB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
        # Healthcheck robusto + tiempo de arranque
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MARIADB_ROOT_PASSWORD || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=60
          --health-start-period=120s

    # Variables disponibles en los steps (usa el hostname del servicio: 'mariadb')
    env:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar cliente MariaDB/MySQL + deps del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client mysql-client

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install opencv-python numpy python-dotenv mysql-connector-python
          fi

      - name: Esperar MariaDB y aplicar schema
        run: |
          echo "Esperando a MariaDB..."
          for i in $(seq 1 60); do
            mysqladmin ping -h "${DB_HOST}" -uroot -p"${DB_PASSWORD}" && break
            echo "mariadb no listo; esperando..."
            sleep 2
          done

          echo "Creando BD si no existe..."
          mysql -h "${DB_HOST}" -P "${DB_PORT}" -uroot -p"${DB_PASSWORD}" \
            -e "CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\`"

          if [ -f db/schema.sql ]; then
            echo "Aplicando schema..."
            mysql -h "${DB_HOST}" -P "${DB_PORT}" -uroot -p"${DB_PASSWORD}" "${DB_NAME}" < db/schema.sql
          else
            echo "[WARN] db/schema.sql no encontrado"
          fi

      - name: Ejecutar run.sh
        run: |
          chmod +x run.sh || true
          bash run.sh

      # (Opcional) Si el job falla, ver logs del contenedor para diagnosticar
      - name: Logs de MariaDB (debug)
        if: failure()
        run: |
          echo "Logs del contenedor mariaDB:"
          docker logs $(docker ps -q --filter "name=mariadb")
