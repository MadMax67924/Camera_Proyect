
name: CI (self-hosted, Python local)

on:
  push:
    branches: [ "LunusushiFeatures" ]
  pull_request:
    branches: [ "LunusushiFeatures" ]
  workflow_dispatch:

jobs:
  run-local-python:
    runs-on: self-hosted   # ✅ ejecuta en tu PC (runner)
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # ✅ Ejecutar tu script real en src/scripts/build_embeddings.py
      - name: Ejecutar build_embeddings (Python local)
        shell: bash
        run: |
          ./run.sh
