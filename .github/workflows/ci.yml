
name: CI (LunusushiFeatureseSA)

on:
  push:
    branches: [ "LunusushiFeatureseSA" ]
  pull_request:
    branches: [ "LunusushiFeatureseSA" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    # ✅ Define la contraseña de MySQL aquí (no en options)
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}
        ports:
          - 3306:3306
        # ✅ Usa la var del contenedor en el health-cmd
        options: >-
          --health-cmd="mysqladmin ping -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    # ✅ Variables disponibles para los steps del job
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar MySQL client y dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Si no tienes requirements.txt, puedes instalar aquí:
          # pip install opencv-python numpy python-dotenv mysql-connector-python

      - name: Esperar MySQL y aplicar schema
        run: |
          # Espera hasta que el servicio reporte salud
          for i in $(seq 1 30); do
            mysqladmin ping -h "${DB_HOST}" -p"${DB_PASSWORD}" && break
            sleep 2
          done

          # Crea la BD y aplica el esquema si existe el archivo
          mysql -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USER}" -p"${DB_PASSWORD}" \
            -e "CREATE DATABASE IF NOT EXISTS ${DB_NAME}"

          if [ -f db/schema.sql ]; then
            mysql -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USER}" -p"${DB_PASSWORD}" "${DB_NAME}" < db/schema.sql
          else
            echo "[WARN] db/schema.sql no encontrado. Asegúrate de subirlo."
          fi

      - name: Ejecutar run.sh
        run: |
          chmod +x run.sh || true
          bash run.sh
